[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "docsearch-ai-rag"
version = "0.1.0"
description = "Production-style RAG document search assistant with pluggable vector stores and LLM providers."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Juan Carlos Amay" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "langchain-text-splitters>=0.2",
    "numpy>=1.26",
    "pypdf>=4.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
milvus = ["pymilvus>=2.4"]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.40"]
all = ["docsearch-ai-rag[milvus,openai,anthropic]"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
docsearch-eval = "docsearch.evaluation:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docsearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM905"]  # str.split() word lists are more readable than long literals

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pymilvus.*", "openai.*", "anthropic.*", "langchain_text_splitters.*", "pypdf.*"]
ignore_missing_imports = true
